<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="wood-grain" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Basfärg — mörkt trä -->
      <rect width="200" height="200" fill="#1c130a"/>
      
      <!-- Horisontella träådringar -->
      <path d="M0,20 Q50,18 100,20 T200,20" stroke="rgba(45,30,15,0.6)" fill="none" stroke-width="1.5"/>
      <path d="M0,50 Q60,48 120,50 T200,52" stroke="rgba(40,25,12,0.5)" fill="none" stroke-width="1.2"/>
      <path d="M0,80 Q40,82 80,80 T200,78" stroke="rgba(50,32,16,0.4)" fill="none" stroke-width="1"/>
      <path d="M0,110 Q70,108 140,110 T200,112" stroke="rgba(35,22,10,0.5)" fill="none" stroke-width="1.3"/>
      <path d="M0,140 Q55,142 110,140 T200,138" stroke="rgba(45,28,14,0.45)" fill="none" stroke-width="1.1"/>
      <path d="M0,170 Q80,168 160,170 T200,172" stroke="rgba(38,24,11,0.55)" fill="none" stroke-width="1.4"/>
      
      <!-- Subtila variationer/ringar -->
      <path d="M0,35 Q30,33 60,35 T120,37 T200,35" stroke="rgba(55,35,18,0.25)" fill="none" stroke-width="0.8"/>
      <path d="M0,95 Q45,97 90,95 T180,93 T200,95" stroke="rgba(48,30,15,0.3)" fill="none" stroke-width="0.7"/>
      <path d="M0,155 Q65,153 130,155 T200,157" stroke="rgba(42,26,12,0.35)" fill="none" stroke-width="0.9"/>
      
      <!-- Subtila vertikala sprickor -->
      <path d="M30,0 Q32,50 30,100 T32,200" stroke="rgba(25,15,8,0.15)" fill="none" stroke-width="0.5"/>
      <path d="M120,0 Q118,70 120,140 T118,200" stroke="rgba(20,12,6,0.12)" fill="none" stroke-width="0.5"/>
      <path d="M170,0 Q172,40 170,90 T172,200" stroke="rgba(22,14,7,0.1)" fill="none" stroke-width="0.4"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#wood-grain)"/>
</svg>