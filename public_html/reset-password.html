<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Återställ lösenord — FISK</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
        }
        .reset-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            max-width: 400px;
            width: 90%;
        }
        .reset-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--space-md);
            text-align: center;
        }
        .form-message {
            min-height: 1.5em;
            margin-top: var(--space-sm);
            text-align: center;
        }
        .form-message.success {
            color: var(--secondary);
        }
        .form-message.error {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h1 class="reset-title">🔒 Återställ lösenord</h1>

        <div id="reset-form-container">
            <p style="color: var(--text-secondary); margin-bottom: var(--space-md);">Ange ditt nya lösenord nedan.</p>
            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">Nytt lösenord</label>
                    <input type="password" id="new-password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Bekräfta lösenord</label>
                    <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Uppdatera lösenord</button>
            </form>
            <p id="reset-message" class="form-message"></p>
        </div>

        <div id="reset-success" class="hidden" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: var(--space-md);">✅</div>
            <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: var(--space-sm);">Lösenord uppdaterat!</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">Ditt lösenord har ändrats. Du kan nu logga in med det nya lösenordet.</p>
            <a href="/" class="btn btn-primary btn-large">Till startsidan</a>
        </div>

        <div id="reset-error" class="hidden" style="text-align: center;">
            <div style="font-size: 3rem; margin-bottom: var(--space-md);">❌</div>
            <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: var(--space-sm);">Ogiltig länk</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">Länken är ogiltig eller har gått ut. Begär en ny återställningslänk.</p>
            <a href="/" class="btn btn-outline">Till startsidan</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('reset-form-container').classList.add('hidden');
            document.getElementById('reset-error').classList.remove('hidden');
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const messageEl = document.getElementById('reset-message');

            if (password !== confirm) {
                messageEl.textContent = 'Lösenorden matchar inte.';
                messageEl.className = 'form-message error';
                return;
            }

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('reset-form-container').classList.add('hidden');
                    document.getElementById('reset-success').classList.remove('hidden');
                } else {
                    messageEl.textContent = data.error || 'Kunde inte uppdatera lösenordet.';
                    messageEl.className = 'form-message error';
                }
            } catch (err) {
                messageEl.textContent = 'Något gick fel. Försök igen.';
                messageEl.className = 'form-message error';
            }
        });
    </script>
</body>
</html>
