<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Finns i Sjön</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <a href="/" class="back-link">← Tillbaka till spelet</a>
            <h1>🎣 Kortleks-admin</h1>
            <p>Hantera och skapa nya kortlekar för Finns i Sjön</p>
        </header>

        <nav class="admin-tabs">
            <button class="tab-btn active" data-tab="themes">📁 Befintliga teman</button>
            <button class="tab-btn" data-tab="creator">✨ Skapa nytt tema</button>
        </nav>

        <!-- TAB: Befintliga teman -->
        <section id="themes-tab" class="tab-panel active">
            <div class="loading" id="themes-loading">Laddar teman...</div>
            <div class="themes-grid" id="themes-grid"></div>
        </section>

        <!-- TAB: Skapa nytt tema -->
        <section id="creator-tab" class="tab-panel">
            <div class="creator-form">
                <div class="form-group">
                    <label for="theme-name">Temanamn (mappnamn)</label>
                    <input type="text" id="theme-name" placeholder="t.ex. djur, bilar, yrken" maxlength="30">
                    <small>Endast små bokstäver, siffror och bindestreck. Ex: <code>havsdjur</code></small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bg-color">Bakgrundsfärg</label>
                        <input type="color" id="bg-color" value="#1e3a5f">
                    </div>
                    <div class="form-group">
                        <label for="bg-gradient">Gradient-riktning</label>
                        <select id="bg-gradient">
                            <option value="none">Solid färg</option>
                            <option value="linear-down">Ljusare nedåt</option>
                            <option value="linear-up">Ljusare uppåt</option>
                            <option value="radial">Radial (mitten)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="card-style">Kortstil</label>
                    <div class="style-options">
                        <label class="style-option">
                            <input type="radio" name="card-style" value="emoji" checked>
                            <span>😊 Emoji-centrerad</span>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="card-style" value="image">
                            <span>🖼️ Bild per kort</span>
                        </label>
                    </div>
                </div>
            </div>

            <h3>Välj innehåll för varje kort</h3>
            <div class="cards-editor" id="cards-editor"></div>

            <div class="creator-actions">
                <button class="btn btn-secondary" id="preview-btn">👁️ Förhandsgranska alla</button>
                <button class="btn btn-primary" id="generate-btn">🎨 Generera & ladda ner ZIP</button>
            </div>

            <div class="preview-area hidden" id="preview-area">
                <h3>Förhandsgranskning</h3>
                <div class="preview-grid" id="preview-grid"></div>
            </div>
        </section>
    </div>

    <canvas id="card-canvas" width="400" height="560" style="display:none;"></canvas>
    <script src="/admin/admin.js"></script>
</body>
</html>
