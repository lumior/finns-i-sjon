<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Finns i Sjön</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/admin/jszip.min.js"></script>
    <script src="/admin/FileSaver.min.js"></script>
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <a href="/" class="back-link">← Tillbaka till spelet</a>
            <h1>🎣 Kortleks-admin</h1>
            <p>Skapa en komplett kortlek med 52 kort (4 färger × 13 valörer)</p>
        </header>

        <nav class="admin-tabs">
            <button class="tab-btn active" data-tab="themes">📁 Befintliga teman</button>
            <button class="tab-btn" data-tab="creator">✨ Skapa ny kortlek</button>
        </nav>

        <!-- TAB: Befintliga teman -->
        <section id="themes-tab" class="tab-panel active">
            <div class="loading" id="themes-loading">Laddar teman...</div>
            <div class="themes-grid" id="themes-grid"></div>
        </section>

        <!-- TAB: Skapa ny kortlek -->
        <section id="creator-tab" class="tab-panel">
            <div class="creator-form">
                <div class="form-group">
                    <label for="theme-name">Kortleksnamn (för ZIP-filen)</label>
                    <input type="text" id="theme-name" placeholder="t.ex. mitt-tema" maxlength="30">
                    <small>Endast små bokstäver, siffror och bindestreck.</small>
                </div>

                <div class="suits-intro">
                    <p>En kortlek har fyra färger. Välj innehåll för <strong>alla 52 kort</strong> nedan.</p>
                </div>
            </div>

            <!-- Suit tabs -->
            <div class="suit-tabs">
                <button class="suit-tab active" data-suit="hearts">
                    <span class="suit-icon">♥️</span>
                    <span class="suit-name">Hjärter</span>
                </button>
                <button class="suit-tab" data-suit="diamonds">
                    <span class="suit-icon">♦️</span>
                    <span class="suit-name">Ruter</span>
                </button>
                <button class="suit-tab" data-suit="clubs">
                    <span class="suit-icon">♣️</span>
                    <span class="suit-name">Klöver</span>
                </button>
                <button class="suit-tab" data-suit="spades">
                    <span class="suit-icon">♠️</span>
                    <span class="suit-name">Spader</span>
                </button>
            </div>

            <!-- Suit panels -->
            <div id="suit-panels"></div>

            <div class="creator-actions">
                <button class="btn btn-secondary" id="preview-btn">👁️ Förhandsgranska alla 52</button>
                <button class="btn btn-primary" id="generate-btn">🎨 Generera & ladda ner ZIP</button>
            </div>

            <div class="preview-area hidden" id="preview-area">
                <h3>Förhandsgranskning</h3>
                <div class="preview-suits" id="preview-suits"></div>
            </div>
        </section>
    </div>

    <canvas id="card-canvas" width="400" height="560" style="display:none;"></canvas>
    <script src="/admin/admin.js"></script>
</body>
</html>
