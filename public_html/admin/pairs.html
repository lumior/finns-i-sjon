<!DOCTYPE html>
<html lang="sv">
<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hantera par — Admin — FISK</title>
    <link rel="stylesheet" href="/admin/admin.css">
    <style>
        .pairs-toolbar {
            display: flex;
            gap: var(--space-md);
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: var(--space-lg);
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .pairs-toolbar .form-group {
            flex: 1;
            min-width: 220px;
            margin-bottom: 0;
        }

        .pairs-toolbar .btn {
            white-space: nowrap;
        }

        .pairs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }

        .pair-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            transition: border-color 0.2s;
        }

        .pair-card:hover {
            border-color: var(--accent);
        }

        .pair-card.missing-a {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.05);
        }

        .pair-previews {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-sm);
        }

        .pair-preview {
            width: 100%;
            aspect-ratio: 5/7;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pair-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pair-preview .placeholder {
            font-size: 2rem;
            opacity: 0.3;
        }

        .pair-preview-label {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-weight: 600;
        }

        .pair-id-input,
        .pair-name-input {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .pair-id-input:focus,
        .pair-name-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .pair-id-input.invalid {
            border-color: var(--danger);
        }

        .pair-image-input {
            width: 100%;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .pair-image-inputs {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .same-image-toggle {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .same-image-toggle input {
            cursor: pointer;
        }

        .save-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: var(--space-md);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            z-index: 100;
        }

        .save-bar .btn {
            min-width: 160px;
        }

        .pairs-empty {
            text-align: center;
            padding: var(--space-xl);
            color: var(--text-secondary);
        }

        .create-theme-section {
            display: none;
            margin-bottom: var(--space-lg);
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .create-theme-section.active {
            display: block;
        }

        .create-theme-actions {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-sm);
        }

        .ai-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            align-items: flex-end;
            margin-bottom: var(--space-lg);
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .ai-toolbar .form-group {
            margin-bottom: 0;
            min-width: 140px;
        }

        .ai-toolbar input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .ai-progress-wrap {
            display: none;
            margin-bottom: var(--space-lg);
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .ai-progress-wrap.active {
            display: block;
        }

        .ai-progress-bar {
            width: 100%;
            height: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: var(--space-sm);
        }

        .ai-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            transition: width 0.3s ease;
        }

        .ai-progress-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .theme-info {
            margin-bottom: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .theme-info h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .theme-info p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .pair-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .danger-text {
            color: var(--danger);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="admin-container" style="padding-bottom: 80px;">
        <header class="admin-header">
            <a href="/admin/" class="back-link">← Tillbaka till admin</a>
            <h1>🖼️ Hantera par</h1>
            <p>Skapa och redigera par-baserade kortlekar. Varje par består av två kort — samma eller olika bilder.</p>
        </header>

        <div class="pairs-toolbar">
            <div class="form-group">
                <label for="theme-select">Välj tema</label>
                <select id="theme-select">
                    <option value="">-- Välj tema --</option>
                </select>
            </div>
            <button class="btn btn-secondary" id="create-theme-toggle-btn">➕ Nytt tema</button>
            <button class="btn btn-ai" id="ai-generate-btn" disabled>🤖 Generera med AI</button>
            <button class="btn btn-primary" id="save-btn" disabled>Spara ändringar</button>
        </div>

        <div class="ai-toolbar" id="ai-toolbar" style="display: none;">
            <div class="form-group">
                <label for="ai-primary-color">Primärfärg</label>
                <input type="color" id="ai-primary-color" value="#4a90d9">
            </div>
            <div class="form-group">
                <label for="ai-secondary-color">Sekundärfärg</label>
                <input type="color" id="ai-secondary-color" value="#f5a623">
            </div>
            <div class="form-group" style="flex: 1; min-width: 220px;">
                <label for="ai-style">Stil</label>
                <select id="ai-style" class="pair-name-input" style="font-size: 0.85rem;">
                    <option value="Vector illustration, flat design, no text">Vektor / flat design</option>
                    <option value="Colorful cartoon illustration, no text">Cartoon</option>
                    <option value="Watercolor painting, soft colors, no text">Akvarell</option>
                    <option value="Pixel art, retro game style, no text">Pixelart</option>
                    <option value="3D render, soft lighting, no text">3D-render</option>
                </select>
            </div>
            <button class="btn btn-small" id="ai-cancel-btn" style="display: none;">⛔ Avbryt</button>
        </div>

        <div class="ai-progress-wrap" id="ai-progress-wrap">
            <div class="ai-progress-bar">
                <div class="ai-progress-fill" id="ai-progress-fill"></div>
            </div>
            <div class="ai-progress-text" id="ai-progress-text">Redo att generera</div>
        </div>

        <div class="create-theme-section" id="create-theme-section">
            <h3>Skapa nytt par-baserat tema</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="new-theme-folder">Mappnamn (tekniskt)</label>
                    <input type="text" id="new-theme-folder" placeholder="t.ex. frukt-tema" maxlength="30">
                    <small>Endast små bokstäver, siffror och bindestreck.</small>
                </div>
                <div class="form-group">
                    <label for="new-theme-name">Visningsnamn</label>
                    <input type="text" id="new-theme-name" placeholder="t.ex. Frukt-tema" maxlength="50">
                </div>
            </div>
            <div class="create-theme-actions">
                <button class="btn btn-primary" id="create-theme-btn">Skapa tema med 26 par</button>
                <button class="btn btn-small" id="cancel-create-btn">Avbryt</button>
            </div>
        </div>

        <div class="theme-info" id="theme-info" style="display: none;">
            <div>
                <h2 id="theme-info-name">—</h2>
                <p id="theme-info-folder">—</p>
            </div>
            <div class="pair-count" id="pair-count">0 par</div>
        </div>

        <div class="loading" id="pairs-loading" style="display: none;">Laddar par...</div>
        <div class="pairs-empty" id="pairs-empty">Välj ett tema för att börja redigera.</div>
        <div class="pairs-grid" id="pairs-grid"></div>
    </div>

    <script src="/admin/pairs.js?v=4"></script>
</body>
</html>
