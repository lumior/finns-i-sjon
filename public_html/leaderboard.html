<!DOCTYPE html>
<html lang="sv">
<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Topplista – FISK</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-brand">
            <a href="/" class="nav-link" style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 900;">
                <span class="logo">🎣</span>
                <span>FISK <span class="pro-badge">- Finns i sjön</span></span>
            </a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">← Tillbaka till spelet</a>
        </div>
    </nav>

    <main class="main-content" style="padding-top: 100px;">
        <h1 style="font-family: var(--font-display); font-size: 3rem; text-align: center; margin-bottom: var(--space-xl);">
            🏆 Topplista
        </h1>
        
        <div class="leaderboard-filters" style="display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); justify-content: center;">
            <button class="tab-btn active" data-filter="all">Alla</button>
            <button class="tab-btn" data-filter="week">Denna vecka</button>
            <button class="tab-btn" data-filter="month">Denna månad</button>
        </div>
        
        <div id="full-leaderboard" class="leaderboard-list" style="max-width: 800px; margin: 0 auto;">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Laddar topplista...</p>
            </div>
        </div>
    </main>

    <script src="/js/leaderboard.js"></script>
</body>
</html>
